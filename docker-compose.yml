services:

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       passphrase_generator
      POSTGRES_USER:     passphrase
      POSTGRES_PASSWORD: passphrase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passphrase -d passphrase_generator"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:  postgres://passphrase:passphrase@db:5432/passphrase_generator
      DJANGO_SECRET: change-me-in-production
      DEBUG:         "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
